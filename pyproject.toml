[project]
name = "torch-board"
version = "0.1.0"
description="Live monitoring dashboard for machine learning training"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "jupyter-console>=6.6.3",
    "pynvim>=0.6.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/board"]

[tool.basedpyright]
reportMissingTypeStubs = false
reportUnusedCallResult = false
